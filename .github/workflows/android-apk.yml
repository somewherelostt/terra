name: Android APK

# Builds the signed release APK when a v* tag is pushed (or by hand), uploads it as a
# workflow artifact, and attaches it to the tag's GitHub release if that release has no APK yet.
# Needs repo secrets ANDROID_KEYSTORE_BASE64 (base64 of the .jks) and ANDROID_KEYSTORE_PASSWORD.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then echo "::error::Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/terra-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=terra\nkeyPassword=%s\n' "$RUNNER_TEMP/terra-release.jks" "$KS_PW" "$KS_PW" > "$RUNNER_TEMP/keystore.properties"
          echo "TERRA_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
      - name: Build
        env:
          CI: "true"
        run: scripts/android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: terra-apk
          path: android/app/build/outputs/apk/release/terra-*.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -q '\.apk$'; then
            echo "Release $tag already has an APK; leaving it."
          else
            gh release upload "$tag" android/app/build/outputs/apk/release/terra-*.apk || echo "No release for $tag yet; the APK is in the workflow artifact."
          fi
